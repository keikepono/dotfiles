unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g mouse on
# Resize panes with Alt + arrow keys
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
# Session picker shows creation date and memory (no colon in the strftime: tmux splits on it)
bind s run-shell "~/Axon/dotfiles/tmux/tmux-mem.sh" \; choose-tree -Zs -F '#{t/f/%m-%d:session_created} #{?window_format,[#{@mem}],[#{@session_mem}]}'
# Prompt for a name, then create the session (or switch to it if it exists)
bind a command-prompt -p "New session name:" "new-session -A -s '%%'"
# Window picker shows memory used by each window's processes (and session totals)
bind w run-shell "~/Axon/dotfiles/tmux/tmux-mem.sh" \; choose-tree -Zw -F '#{?window_format,#{window_name}#{window_flags} (#{window_panes} panes) [#{@mem}],#{?session_format,#{session_windows} windows [#{@session_mem}]#{?session_attached, (attached),},#{pane_current_command}}}'
